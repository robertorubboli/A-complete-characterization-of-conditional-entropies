name: Lean checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build Lean declarations
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: >-
            ConditionalEntropy
            BoundaryProofs
            --wfail

      - name: Verify source and kernel dependencies
        run: bash ./scripts/check.sh --no-build
