<svg xmlns="http://www.w3.org/2000/svg" width="920" height="610" viewBox="0 0 920 610" role="img" aria-labelledby="title desc">
  <title id="title">Lean formalization dependency graph</title>
  <desc id="desc">Arrows point from the assembled conclusions to their ingredients. Blue nodes are standalone boundary proofs.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
    <style>
      .node { fill:#f8fafc; stroke:#475569; stroke-width:1.4; rx:8; }
      .boundary { fill:#dbeafe; stroke:#2563eb; stroke-width:1.6; rx:8; }
      .edge { fill:none; stroke:#64748b; stroke-width:1.4; marker-end:url(#arrow); }
      .label { fill:#0f172a; font: 15px "Segoe UI", Arial, sans-serif; text-anchor:middle; }
      .caption { fill:#334155; font: 13px "Segoe UI", Arial, sans-serif; }
    </style>
  </defs>

  <rect class="node" x="330" y="25" width="260" height="48"/>
  <text class="label" x="460" y="54">Main parameter conclusions</text>

  <rect class="node" x="70" y="135" width="245" height="58"/>
  <text class="label" x="192.5" y="159"><tspan x="192.5">Section 4 coefficient</tspan><tspan x="192.5" dy="19">sufficiency</tspan></text>
  <rect class="node" x="350" y="135" width="245" height="58"/>
  <text class="label" x="472.5" y="159"><tspan x="472.5">Section 5 coefficient</tspan><tspan x="472.5" dy="19">necessity</tspan></text>
  <rect class="node" x="655" y="135" width="195" height="58"/>
  <text class="label" x="752.5" y="169">Parameter profiles</text>

  <rect class="boundary" x="70" y="265" width="245" height="58"/>
  <text class="label" x="192.5" y="299">Curvature boundary proofs</text>
  <rect class="boundary" x="350" y="265" width="245" height="58"/>
  <text class="label" x="472.5" y="289"><tspan x="472.5">Exact stationarity</tspan><tspan x="472.5" dy="19">correction</tspan></text>
  <rect class="boundary" x="635" y="265" width="245" height="58"/>
  <text class="label" x="757.5" y="289"><tspan x="757.5">Finite midpoint</tspan><tspan x="757.5" dy="19">contradiction</tspan></text>

  <rect class="node" x="245" y="440" width="270" height="58"/>
  <text class="label" x="380" y="464"><tspan x="380">Shape predicates and</tspan><tspan x="380" dy="19">curvature forms</tspan></text>
  <rect class="node" x="20" y="440" width="190" height="58"/>
  <text class="label" x="115" y="464"><tspan x="115">Conditioning</tspan><tspan x="115" dy="19">monotonicity</tspan></text>

  <path class="edge" d="M400 73 L238 135"/>
  <path class="edge" d="M480 73 L475 135"/>
  <path class="edge" d="M545 73 L706 135"/>
  <path class="edge" d="M193 193 L193 265"/>
  <path class="edge" d="M440 193 L250 265"/>
  <path class="edge" d="M473 193 L473 265"/>
  <path class="edge" d="M518 193 L711 265"/>
  <path class="edge" d="M193 323 L330 440"/>
  <path class="edge" d="M473 323 L246 275"/>
  <path class="edge" d="M758 323 L470 440"/>
  <path class="edge" d="M210 469 L245 469"/>

  <rect x="642" y="470" width="20" height="14" class="boundary"/>
  <text class="caption" x="670" y="482">standalone boundary proof</text>
  <text class="caption" x="20" y="575">Arrows point to ingredients.</text>
</svg>
