<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="510" viewBox="0 0 1600 510" role="img" aria-labelledby="title desc">
  <title id="title">Numbered manuscript dependency graph for the checked Lean core</title>
  <desc id="desc">Seven green manuscript result boxes depend on four blue checked ingredient boxes. Counts in the eleven boxes total 36 Lean theorem or lemma declarations.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .edge{fill:none;stroke:#64748b;stroke-width:1.45;stroke-opacity:.82;marker-end:url(#arrow)}
      .paper{fill:#ecfdf5;stroke:#16a34a;stroke-width:1.8}
      .boundary{fill:#eef2ff;stroke:#4f46e5;stroke-width:1.8}
      .label{font-family:Georgia,Cambria,'Times New Roman',serif;font-size:17px;fill:#0f172a;text-anchor:middle}
      .small-label{font-family:Georgia,Cambria,'Times New Roman',serif;font-size:15px;fill:#0f172a;text-anchor:middle}
      .count{font-family:Georgia,Cambria,'Times New Roman',serif;font-size:13px;fill:#475569;text-anchor:middle}
      .caption{font-family:Georgia,Cambria,'Times New Roman',serif;font-size:19px;fill:#0f172a;text-anchor:middle}
      .legend{font-family:Georgia,Cambria,'Times New Roman',serif;font-size:14px;fill:#475569;text-anchor:middle}
    </style>
  </defs>

  <!-- Curved arrows keep all theorem boxes unobstructed. -->
  <path class="edge" d="M115 112 C115 205 200 235 200 340"/>
  <path class="edge" d="M115 112 C115 230 600 210 600 340"/>
  <path class="edge" d="M343 112 C343 210 200 245 200 340"/>
  <path class="edge" d="M571 112 C571 215 600 235 600 340"/>
  <path class="edge" d="M571 112 C571 265 1400 185 1400 340"/>
  <path class="edge" d="M799 112 C799 220 600 245 600 340"/>
  <path class="edge" d="M799 112 C799 245 1400 205 1400 340"/>
  <path class="edge" d="M1027 112 C1027 245 600 205 600 340"/>
  <path class="edge" d="M1027 112 C1027 220 1400 240 1400 340"/>
  <path class="edge" d="M1255 112 C1255 270 600 180 600 340"/>
  <path class="edge" d="M1255 112 C1255 215 1000 245 1000 340"/>
  <path class="edge" d="M1255 112 C1255 205 1400 250 1400 340"/>
  <path class="edge" d="M1483 112 C1483 285 600 165 600 340"/>
  <path class="edge" d="M1483 112 C1483 210 1400 250 1400 340"/>

  <!-- Numbered paper-facing cores. -->
  <rect class="paper" x="10" y="28" width="210" height="84" rx="9"/>
  <text class="label" x="115" y="63">Lemma 4.3 core</text>
  <text class="count" x="115" y="89">(2 Lean theorems)</text>

  <rect class="paper" x="238" y="28" width="210" height="84" rx="9"/>
  <text class="small-label" x="343" y="63">Proposition 4.8 core</text>
  <text class="count" x="343" y="89">(1 Lean theorem)</text>

  <rect class="paper" x="466" y="28" width="210" height="84" rx="9"/>
  <text class="small-label" x="571" y="63">Proposition 5.1 core</text>
  <text class="count" x="571" y="89">(4 Lean theorems)</text>

  <rect class="paper" x="694" y="28" width="210" height="84" rx="9"/>
  <text class="small-label" x="799" y="58">Propositions 5.2–5.3</text>
  <text class="small-label" x="799" y="78">core</text>
  <text class="count" x="799" y="98">(2 Lean theorems)</text>

  <rect class="paper" x="922" y="28" width="210" height="84" rx="9"/>
  <text class="small-label" x="1027" y="63">Proposition 5.6 core</text>
  <text class="count" x="1027" y="89">(1 Lean theorem)</text>

  <rect class="paper" x="1150" y="28" width="210" height="84" rx="9"/>
  <text class="small-label" x="1255" y="58">Negative tropical case</text>
  <text class="small-label" x="1255" y="78">Section 5</text>
  <text class="count" x="1255" y="98">(2 Lean theorems)</text>

  <rect class="paper" x="1378" y="28" width="210" height="84" rx="9"/>
  <text class="small-label" x="1483" y="63">Proposition 5.7 core</text>
  <text class="count" x="1483" y="89">(2 Lean theorems)</text>

  <!-- Checked bridge and boundary proofs. -->
  <rect class="boundary" x="50" y="340" width="300" height="84" rx="9"/>
  <text class="label" x="200" y="375">Appendix A implication</text>
  <text class="count" x="200" y="401">(8 Lean theorems)</text>

  <rect class="boundary" x="450" y="340" width="300" height="84" rx="9"/>
  <text class="label" x="600" y="375">Lemma 4.2 / Lemma B.2</text>
  <text class="count" x="600" y="401">(9 Lean theorems)</text>

  <rect class="boundary" x="850" y="340" width="300" height="84" rx="9"/>
  <text class="label" x="1000" y="375">Lemma B.15</text>
  <text class="count" x="1000" y="401">(2 Lean theorems)</text>

  <rect class="boundary" x="1250" y="340" width="300" height="84" rx="9"/>
  <text class="label" x="1400" y="375">Appendix B.6</text>
  <text class="count" x="1400" y="401">(3 Lean theorems)</text>

  <text class="caption" x="800" y="464">Numbered manuscript dependency graph for the checked Lean core</text>
  <text class="legend" x="800" y="491">Parenthetical counts are disjoint and total 36 checked theorem/lemma declarations.</text>
</svg>
